<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CV Builder</title>
<link rel="icon" href="/static/app.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/pdfjs/pdf.min.js"></script>
</head>
<body>
<header class="toolbar">
  <div class="seg" role="tablist">
    <button class="tab-btn active" id="tabBuild" onclick="switchTab('build')">Build</button>
    <button class="tab-btn" id="tabData" onclick="switchTab('data')">Data</button>
  </div>
  <div class="tb-right">
    <div id="headerBuildBtns">
      <button class="btn" onclick="downloadTex()">Export .tex</button>
      <button class="btn primary" onclick="downloadPdf()">Download PDF</button>
    </div>
    <div id="headerDataBtns" style="display:none">
      <button class="btn primary" onclick="saveData()">Save Data</button>
    </div>
    <button class="btn quiet" id="btnQuit" onclick="quitApp()" title="退出程序">退出</button>
  </div>
</header>

<!-- Build tab -->
<div class="build-layout" id="buildPanel">
  <div class="left">
    <div class="profile-bar">
      <span class="pb-label">Profile</span>
      <select id="profileSelect" onchange="loadProfile(); syncProfileButtons()" title="Load a saved profile">
        <option value="">Custom selection</option>
      </select>
      <button class="btn" onclick="showSaveModal()">Save As…</button>
      <button class="btn quiet" id="btnDelProfile" onclick="deleteProfile()" disabled>Delete</button>
    </div>
    <div id="leftContent"></div>
  </div>
  <div class="right">
    <div class="right-head">
      <div class="seg">
        <button id="segPdf" class="on" onclick="setRightView('pdf')">PDF</button>
        <button id="segTex" onclick="setRightView('tex')">LaTeX</button>
      </div>
      <span class="badge" id="pdfBadge">—</span>
      <span style="flex:1"></span>
      <label class="pe-present" title="关闭后只在点 Refresh(或按 Ctrl+Enter)时重新编译">
        <input type="checkbox" class="switch" id="autoToggle" onchange="setAutoRefresh(this.checked)"> Auto
      </label>
      <button class="btn-sm" id="btnRefresh" onclick="manualRefresh()" title="重新编译预览 (Ctrl+Enter)">Refresh</button>
      <span class="zoom" id="zoomCtl">
        <button onclick="zoomBy(-0.1)" title="Zoom out">−</button>
        <button onclick="zoomBy(0)" title="Fit width" style="padding:0 8px;font-size:11px">Fit</button>
        <button onclick="zoomBy(0.1)" title="Zoom in">+</button>
      </span>
    </div>
    <div id="pdfErr"></div>
    <div id="pdfView"><div id="pdfPages"></div><div id="pdfEmpty">Compiling…</div></div>
    <div id="texWrap"><pre class="tex" id="texPreview">Loading…</pre></div>
  </div>
</div>

<!-- Data tab -->
<div class="data-layout" id="dataPanel" style="display:none">
  <div id="dataContent"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="saveModal">
  <div class="modal-box">
    <h3>Save Profile</h3>
    <input type="text" id="saveModalInput" placeholder="Profile name (e.g. ib, vc, risk)">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideSaveModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitSaveProfile()">Save</button>
    </div>
  </div>
</div>

<script>window.__BOOT = { data: {{ data | tojson }}, profiles: {{ profiles | tojson }}, settings: {{ settings | tojson }} };</script>
<script src="/static/app.js"></script>
</body>
</html>
