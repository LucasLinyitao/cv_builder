<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Builder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #f4f5f7; color: #222; font-size: 14px;
  }
  header {
    background: #1f2933; color: #fff; padding: 6px 16px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  .tab-btn {
    padding: 4px 14px; border: none; border-radius: 4px; cursor: pointer;
    background: #323f4b; color: #9eacbb; font-size: 13px; font-weight: 500;
  }
  .tab-btn.active { background: #2f80ed; color: #fff; }
  header .spacer { flex: 1; }
  header select, header input {
    padding: 5px 8px; border: 1px solid #3c4a57; border-radius: 4px;
    background: #323f4b; color: #fff; font-size: 12px;
    height: 28px;
  }
  header button {
    padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer;
    background: #2f80ed; color: #fff; font-size: 12px; font-weight: 500;
    height: 28px;
  }
  header button.ghost { background: #3c4a57; }
  header button:hover { filter: brightness(1.15); }
  header #buildTools,
  header #headerBuildBtns,
  header #headerDataBtns {
    display: flex; gap: 8px; align-items: center;
  }

  /* === Build layout === */
  .build-layout { display: flex; height: calc(100vh - 48px); }
  .left {
    width: 46%; overflow-y: auto; padding: 16px;
    border-right: 1px solid #e0e3e8;
  }
  .right {
    width: 54%; overflow-y: auto; padding: 0;
    background: #fff;
  }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: #6b7785; margin: 18px 0 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .item {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #e0e3e8; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .item label { flex: 1; cursor: pointer; }
  .item .meta { font-size: 12px; color: #6b7785; }
  .item select {
    padding: 3px 6px; border: 1px solid #cfd4da; border-radius: 4px;
    font-size: 12px; max-width: 90px;
  }
  .item .move {
    border: none; background: #eef1f4; color: #485563; cursor: pointer;
    width: 24px; height: 24px; border-radius: 4px; font-size: 13px;
  }
  .item .move:hover { background: #dde3e9; }
  .item .move:disabled { opacity: .3; cursor: default; }
  pre.tex {
    margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-word;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px;
    line-height: 1.5; color: #1a1a1a; height: 100%;
  }
  .right-head {
    padding: 8px 16px; background: #fafbfc; border-bottom: 1px solid #e0e3e8;
    font-size: 12px; color: #6b7785; display: flex; align-items: center; gap: 8px;
  }

  /* === Data tab === */
  .data-layout {
    height: calc(100vh - 48px); overflow-y: auto; padding: 20px 24px 60px;
  }
  .data-card {
    background: #fff; border: 1px solid #e0e3e8; border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
  }
  .data-card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; cursor: pointer; user-select: none;
    background: #fafbfc; border-bottom: 1px solid transparent;
  }
  .data-card.open .data-card-header {
    border-bottom-color: #e0e3e8;
  }
  .data-card-header .title {
    flex: 1; font-weight: 600; font-size: 14px;
  }
  .data-card-header .sub {
    font-size: 12px; color: #6b7785;
  }
  .data-card-header .chevron {
    transition: transform .2s; font-size: 12px; color: #8a94a0;
  }
  .data-card.open .data-card-header .chevron {
    transform: rotate(90deg);
  }
  .data-card-body {
    display: none; padding: 14px;
  }
  .data-card.open .data-card-body { display: block; }
  .data-card-body input[type=text] {
    padding: 6px 10px; border: 1px solid #cfd4da; border-radius: 4px;
    font-size: 13px; width: 100%; margin-bottom: 6px;
  }
  .data-card-body input[type=text].half { width: calc(50% - 4px); }
  .data-card-body .row { display: flex; gap: 8px; }
  .data-card-body label.field {
    display: block; font-size: 11px; font-weight: 600;
    color: #6b7785; margin: 8px 0 3px; text-transform: uppercase;
  }
  .data-card-body label.field:first-child { margin-top: 0; }

  .variant-block {
    background: #f7f8fa; border: 1px solid #e0e3e8; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .variant-block .vr-head {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  }
  .variant-block .vr-head input {
    margin-bottom: 0 !important; flex: 1;
    font-weight: 600; font-size: 12px;
  }
  .variant-block textarea {
    width: 100%; min-height: 70px; padding: 8px; border: 1px solid #cfd4da;
    border-radius: 4px; font-size: 13px; font-family: inherit; resize: vertical;
    line-height: 1.5;
  }
  .btn-sm {
    padding: 3px 10px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 12px; background: #eef1f4; color: #485563;
  }
  .btn-sm:hover { background: #dde3e9; }
  .btn-sm.danger { background: #fce4e4; color: #c62828; }
  .btn-sm.danger:hover { background: #f9cccc; }
  .btn-sm.accent { background: #e3f2fd; color: #1565c0; }
  .btn-sm.accent:hover { background: #bbdefb; }
  .card-actions {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #e0e3e8; display: flex; gap: 8px;
    justify-content: space-between;
  }
  .save-bar {
    position: sticky; bottom: 0; background: #fff; border-top: 2px solid #e0e3e8;
    padding: 12px 24px; display: flex; gap: 10px; align-items: center;
    z-index: 10;
  }
  .save-bar button {
    padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .btn-save {
    background: #2f80ed; color: #fff;
  }
  .btn-save:hover { filter: brightness(1.1); }
  .save-bar .hint {
    font-size: 12px; color: #8a94a0; flex: 1;
  }

  .profile-save {
    position: sticky; bottom: 0; padding: 8px 16px;
    display: flex; justify-content: flex-end;
  }
  .profile-save button {
    padding: 6px 18px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 500;
    background: #2f80ed; color: #fff;
  }
  .profile-save button:hover { filter: brightness(1.1); }

  #headerDataBtns button {
    padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-weight: 500;
  }
  #headerDataBtns .btn-data-save {
    background: #2f80ed; color: #fff; padding: 4px 14px;
  }
  #headerDataBtns .btn-data-add {
    background: #3c4a57; color: #fff;
  }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1f2933; color: #fff; padding: 8px 16px; border-radius: 6px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: .95; }

  /* === Modal === */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: #fff; border-radius: 8px; padding: 24px 28px;
    min-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  .modal-box h3 { margin: 0 0 16px; font-size: 16px; }
  .modal-box input {
    width: 100%; padding: 8px 12px; border: 1px solid #cfd4da;
    border-radius: 4px; font-size: 14px; margin-bottom: 16px;
  }
  .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-box .modal-actions button {
    padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  .modal-box .modal-actions .btn-cancel { background: #eef1f4; color: #485563; }
  .modal-box .modal-actions .btn-confirm { background: #2f80ed; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>CV Builder</h1>
  <button class="tab-btn active" id="tabBuild" onclick="switchTab('build')">Build</button>
  <button class="tab-btn" id="tabData" onclick="switchTab('data')">Data</button>
  <div id="buildTools">
    <select id="profileSelect" title="Load profile">
      <option value="">— Load profile —</option>
    </select>
    <button class="ghost" onclick="loadProfile()">Load</button>
  </div>
  <div class="spacer"></div>
  <div id="headerBuildBtns">
    <button class="ghost" onclick="downloadTex()">Download .tex</button>
    <button class="ghost" onclick="compilePdf()">Compile PDF</button>
    <button class="ghost" onclick="downloadPdf()">Download PDF</button>
  </div>
  <div id="headerDataBtns" style="display:none">
    <button class="btn-data-add" onclick="addNew('educations')">+ Add Education</button>
    <button class="btn-data-add" onclick="addNew('experiences')">+ Add Experience</button>
    <button class="btn-data-add" onclick="addNew('projects')">+ Add Project</button>
    <button class="btn-data-save" onclick="saveData()">Save Data</button>
  </div>
</header>

<!-- Build tab -->
<div class="build-layout" id="buildPanel">
  <div class="left">
    <div id="leftContent"></div>
    <div class="profile-save">
      <button onclick="showSaveModal()">Save Profile</button>
    </div>
  </div>
  <div class="right">
    <div class="right-head"><span>LaTeX preview (live)</span></div>
    <pre class="tex" id="texPreview">Loading…</pre>
  </div>
</div>

<!-- Data tab -->
<div class="data-layout" id="dataPanel" style="display:none">
  <div id="dataContent"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="saveModal">
  <div class="modal-box">
    <h3>Save Profile</h3>
    <input type="text" id="saveModalInput" placeholder="Profile name (e.g. ib, vc, risk)">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideSaveModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitSaveProfile()">Save</button>
    </div>
  </div>
</div>

<script>
// ====================== Init ======================
const RAW_DATA = {{ data | tojson }};
let editData = JSON.parse(JSON.stringify(RAW_DATA));

// ---- Build state ----
let eduChecked = {};
let expItems = [];
let projItems = [];
let skillsChecked = true;

function initBuildState() {
  (RAW_DATA.education || []).forEach(e => { eduChecked[e.id] = true; });
  Object.entries(RAW_DATA.experiences || {}).forEach(([id, exp]) => {
    const vs = Object.keys(exp.variants || {});
    expItems.push({ id, checked: true, variant: vs[0] });
  });
  Object.entries(RAW_DATA.projects || {}).forEach(([id, proj]) => {
    const vs = Object.keys(proj.variants || {});
    projItems.push({ id, checked: true, variant: vs[0] });
  });
}

function buildProfile() {
  return {
    education: (RAW_DATA.education || []).map(e => e.id).filter(id => eduChecked[id]),
    experiences: expItems.filter(it => it.checked).map(it => `${it.id}:${it.variant}`),
    projects: projItems.filter(it => it.checked).map(it => `${it.id}:${it.variant}`),
    include_skills: skillsChecked
  };
}

// ====================== Tab switch ======================
function switchTab(tab) {
  document.getElementById("tabBuild").classList.toggle("active", tab === "build");
  document.getElementById("tabData").classList.toggle("active", tab === "data");
  document.getElementById("buildPanel").style.display = tab === "build" ? "flex" : "none";
  document.getElementById("dataPanel").style.display = tab === "data" ? "block" : "none";
  document.getElementById("buildTools").style.display = tab === "build" ? "" : "none";
  document.getElementById("headerBuildBtns").style.display = tab === "build" ? "" : "none";
  document.getElementById("headerDataBtns").style.display = tab === "data" ? "" : "none";
  if (tab === "data") renderDataTab();
}

// ====================== Build tab render ======================
function variantOptions(variants, selected) {
  return Object.keys(variants).map(v =>
    `<option value="${v}" ${v === selected ? "selected" : ""}>${v}</option>`
  ).join("");
}

function renderBuild() {
  const left = document.getElementById("leftContent");
  let html = "<div class='section-title'>Education</div>";
  (RAW_DATA.education || []).forEach(e => {
    html += `<div class="item">
      <input type="checkbox" ${eduChecked[e.id] ? "checked" : ""}
        onchange="eduChecked['${e.id}']=this.checked; refreshPreview()">
      <label>${e.institution} <span class="meta">— ${e.degree}</span></label>
    </div>`;
  });
  html += "<div class='section-title'>Professional Experience</div>";
  expItems.forEach((it, i) => {
    const exp = RAW_DATA.experiences[it.id];
    if (!exp) return;
    html += `<div class="item">
      <input type="checkbox" ${it.checked ? "checked" : ""}
        onchange="expItems[${i}].checked=this.checked; refreshPreview()">
      <label>${exp.company} <span class="meta">— ${exp.role}</span></label>
      <select onchange="expItems[${i}].variant=this.value; refreshPreview()">
        ${variantOptions(exp.variants, it.variant)}
      </select>
      <button class="move" ${i === 0 ? "disabled" : ""}
        onclick="moveBuild(expItems,${i},-1)">↑</button>
      <button class="move" ${i === expItems.length-1 ? "disabled" : ""}
        onclick="moveBuild(expItems,${i},1)">↓</button>
    </div>`;
  });
  html += "<div class='section-title'>Projects &amp; Competitions</div>";
  projItems.forEach((it, i) => {
    const proj = RAW_DATA.projects[it.id];
    if (!proj) return;
    html += `<div class="item">
      <input type="checkbox" ${it.checked ? "checked" : ""}
        onchange="projItems[${i}].checked=this.checked; refreshPreview()">
      <label>${proj.title}</label>
      <select onchange="projItems[${i}].variant=this.value; refreshPreview()">
        ${variantOptions(proj.variants, it.variant)}
      </select>
      <button class="move" ${i===0?"disabled":""} onclick="moveBuild(projItems,${i},-1)">↑</button>
      <button class="move" ${i===projItems.length-1?"disabled":""} onclick="moveBuild(projItems,${i},1)">↓</button>
    </div>`;
  });
  html += `<div class="section-title">Skills</div>
    <div class="item">
      <input type="checkbox" ${skillsChecked?"checked":""} onchange="skillsChecked=this.checked;refreshPreview()">
      <label>Include Skills &amp; Languages section</label>
    </div>`;
  left.innerHTML = html;
}

function moveBuild(arr, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderBuild();
  refreshPreview();
}

let previewTimer = null;
function refreshPreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 250);
}

function updatePreview() {
  const profile = buildProfile();
  fetch("/api/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(profile)
  }).then(r => r.text())
    .then(tex => { document.getElementById("texPreview").textContent = tex; })
    .catch(e => { document.getElementById("texPreview").textContent = "Error: " + e; });
}

function downloadTex() {
  const name = "cv";
  fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ profile: buildProfile(), name })
  }).then(r => r.json()).then(data => {
    const blob = new Blob([data.tex], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name + ".tex"; a.click();
    toast("Downloaded " + name + ".tex");
  });
}

function compilePdf() {
  toast("Compiling…");
  fetch("/api/compile", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ profile: buildProfile(), name: "cv" })
  }).then(r => r.json()).then(resp => {
    if (resp.ok) { toast("Compiled successfully"); return; }
    const d = resp.detail || {};
    toast("Compile failed — " + (d.xelatex_error || "unknown error"));
  }).catch(() => toast("Compile request failed"));
}

function downloadPdf() {
  toast("Downloading PDF…");
  fetch("/api/download_pdf?name=cv")
    .then(r => { if (!r.ok) throw new Error("PDF not found"); return r.blob(); })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "cv.pdf";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    })
    .catch(() => toast("PDF not found — Compile first"));
}

function showSaveModal() {
  document.getElementById("saveModal").classList.remove("hidden");
  document.getElementById("saveModalInput").value = "";
  document.getElementById("saveModalInput").focus();
}

function hideSaveModal() {
  document.getElementById("saveModal").classList.add("hidden");
}

function submitSaveProfile() {
  const name = document.getElementById("saveModalInput").value.trim();
  if (!name) { toast("Enter a profile name"); return; }
  fetch("/api/save_profile", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, profile: buildProfile() })
  }).then(r => r.json()).then(data => {
    populateProfiles(data.profiles);
    document.getElementById("profileSelect").value = "cv_profile_" + name + ".yaml";
    hideSaveModal();
    toast("Saved cv_profile_" + name + ".yaml");
  });
}

function saveProfile() {
  showSaveModal();
}

function loadProfile() {
  const sel = document.getElementById("profileSelect").value;
  if (!sel) { toast("Select a profile first"); return; }
  fetch("/api/load_profile/" + encodeURIComponent(sel))
    .then(r => r.json()).then(p => applyProfile(p));
}

function applyProfile(p) {
  eduChecked = {};
  (RAW_DATA.education || []).forEach(e => { eduChecked[e.id] = false; });
  (p.education || []).forEach(id => { eduChecked[id] = true; });
  expItems = (p.experiences || []).map(entry => {
    const [id, v] = entry.split(":");
    return { id, checked: true, variant: v || firstVariantBuild(id, "experiences") };
  });
  projItems = (p.projects || []).map(entry => {
    const [id, v] = entry.split(":");
    return { id, checked: true, variant: v || firstVariantBuild(id, "projects") };
  });
  skillsChecked = p.include_skills !== false;
  renderBuild();
  refreshPreview();
  toast("Profile loaded");
}

function firstVariantBuild(id, kind) {
  const obj = RAW_DATA[kind][id];
  return obj ? Object.keys(obj.variants)[0] : "v1";
}

function populateProfiles(profiles) {
  const sel = document.getElementById("profileSelect");
  sel.innerHTML = '<option value="">— Load profile —</option>' +
    profiles.map(p => `<option value="${p}">${p}</option>`).join("");
}

// ====================== Data tab ======================
function getOrder(kind) {
  if (!editData._order) editData._order = { experiences: [], projects: [] };
  const order = editData._order[kind];
  const section = editData[kind] || {};
  // Ensure all existing keys in order, add new ones at end
  const sectionIds = Object.keys(section);
  sectionIds.forEach(id => { if (!order.includes(id)) order.push(id); });
  // Remove stale entries
  for (let i = order.length - 1; i >= 0; i--) {
    if (!section[order[i]]) order.splice(i, 1);
  }
  return order;
}

function renderDataTab() {
  const el = document.getElementById("dataContent");
  let html = "";

  // Personal info
  const p = editData.personal || {};
  html += `<div class="section-title">Personal Info</div>`;
  html += `<div class="data-card open"><div class="data-card-body">`;
  html += `<div class="row">`;
  html += `<div style="flex:1"><label class="field">Name</label>`;
  html += `<input type="text" value="${escAttr(p.name||'')}" data-personal-field="name" style="width:100%"></div>`;
  html += `<div style="flex:1"><label class="field">Email</label>`;
  html += `<input type="text" value="${escAttr(p.email||'')}" data-personal-field="email" style="width:100%"></div>`;
  html += `</div>`;
  html += `<div class="row">`;
  html += `<div style="flex:1"><label class="field">Phone</label>`;
  html += `<input type="text" value="${escAttr(p.phone||'')}" data-personal-field="phone" style="width:100%"></div>`;
  html += `<div style="flex:1"><label class="field">Location</label>`;
  html += `<input type="text" value="${escAttr(p.location||'')}" data-personal-field="location" style="width:100%"></div>`;
  html += `</div>`;
  html += `</div></div>`;

  // Education
  html += `<div class="section-title">Education</div>`;
  const eduList = editData.education || [];
  eduList.forEach((edu, i) => {
    html += renderEduCard(i, eduList.length, edu);
  });

  // Experiences
  html += `<div class="section-title">Professional Experience</div>`;
  const expOrder = getOrder("experiences");
  const exps = editData.experiences || {};
  expOrder.forEach(id => {
    html += renderExpCard(id, expOrder, exps[id]);
  });

  // Projects
  html += `<div class="section-title">Projects &amp; Competitions</div>`;
  const projOrder = getOrder("projects");
  const projs = editData.projects || {};
  projOrder.forEach(id => {
    html += renderProjCard(id, projOrder, projs[id]);
  });

  // Skills
  html += `<div class="section-title">Skills &amp; Languages</div>`;
  html += `<div class="data-card open"><div class="data-card-body">`;
  const skills = editData.skills || {};
  const skillKeys = Object.keys(skills);
  skillKeys.forEach((key, i) => {
    html += `<div class="row" style="margin-bottom:6px;align-items:center">
      <input type="text" value="${escAttr(key)}" data-skill-key="${i}" style="width:140px;flex-shrink:0;margin-bottom:0"
        placeholder="skill category">
      <input type="text" value="${escAttr(skills[key]||'')}" data-skill-val="${i}" style="flex:1;margin-bottom:0"
        placeholder="content">
      <button class="btn-sm danger" onclick="removeSkill(${i})">−</button>
    </div>`;
  });
  html += `<button class="btn-sm accent" onclick="addSkill()" style="margin-top:4px">+ Skill row</button>`;
  html += `</div></div>`;

  el.innerHTML = html;
}

function renderExpCard(id, order, exp) {
  if (!exp) return "";
  const vs = exp.variants || {};
  const vNames = Object.keys(vs);
  const idx = order.indexOf(id);
  const total = order.length;
  return `<div class="data-card" id="card_experiences_${id}">
    <div class="data-card-header" onclick="toggleCard(this)">
      <span class="chevron">▸</span>
      <span class="title">${esc(exp.company || '(untitled)')}</span>
      <span class="sub">${esc(exp.role || '')}</span>
      <span class="sub">${esc(exp.period || '')}</span>
      <button class="move" ${idx===0?"disabled":""} onclick="event.stopPropagation();moveData('experiences',${idx},-1)">↑</button>
      <button class="move" ${idx===total-1?"disabled":""} onclick="event.stopPropagation();moveData('experiences',${idx},1)">↓</button>
    </div>
    <div class="data-card-body">
      <label class="field">Company</label>
      <input type="text" value="${escAttr(exp.company||'')}" data-field="company" data-kind="experiences" data-id="${id}">
      <div class="row">
        <div style="flex:1"><label class="field">Role</label>
          <input type="text" class="half" style="width:100%" value="${escAttr(exp.role||'')}" data-field="role" data-kind="experiences" data-id="${id}">
        </div>
        <div style="flex:1"><label class="field">Location</label>
          <input type="text" class="half" style="width:100%" value="${escAttr(exp.location||'')}" data-field="location" data-kind="experiences" data-id="${id}">
        </div>
      </div>
      <label class="field">Period</label>
      <input type="text" value="${escAttr(exp.period||'')}" data-field="period" data-kind="experiences" data-id="${id}">

      <label class="field">Variants</label>
      ${vNames.map(vn => renderVariantBlock("experiences", id, vn, vs[vn] || [])).join("")}
      <button class="btn-sm accent" onclick="addVariant('experiences','${id}')" style="margin-top:4px">+ Variant</button>

      <div class="card-actions">
        <span></span>
        <button class="btn-sm danger" onclick="deleteCard('experiences','${id}')">Delete this experience</button>
      </div>
    </div>
  </div>`;
}

function renderProjCard(id, order, proj) {
  if (!proj) return "";
  const vs = proj.variants || {};
  const vNames = Object.keys(vs);
  const idx = order.indexOf(id);
  const total = order.length;
  return `<div class="data-card" id="card_projects_${id}">
    <div class="data-card-header" onclick="toggleCard(this)">
      <span class="chevron">▸</span>
      <span class="title">${esc(proj.title || '(untitled)')}</span>
      <span class="sub">${esc(proj.period || '')}</span>
      <button class="move" ${idx===0?"disabled":""} onclick="event.stopPropagation();moveData('projects',${idx},-1)">↑</button>
      <button class="move" ${idx===total-1?"disabled":""} onclick="event.stopPropagation();moveData('projects',${idx},1)">↓</button>
    </div>
    <div class="data-card-body">
      <label class="field">Title</label>
      <input type="text" value="${escAttr(proj.title||'')}" data-field="title" data-kind="projects" data-id="${id}">
      <label class="field">Period</label>
      <input type="text" value="${escAttr(proj.period||'')}" data-field="period" data-kind="projects" data-id="${id}">

      <label class="field">Variants</label>
      ${vNames.map(vn => renderVariantBlock("projects", id, vn, vs[vn] || [])).join("")}
      <button class="btn-sm accent" onclick="addVariant('projects','${id}')" style="margin-top:4px">+ Variant</button>

      <div class="card-actions">
        <span></span>
        <button class="btn-sm danger" onclick="deleteCard('projects','${id}')">Delete this project</button>
      </div>
    </div>
  </div>`;
}

function renderEduCard(idx, total, edu) {
  if (!edu) return "";
  return `<div class="data-card" id="card_education_${idx}">
    <div class="data-card-header" onclick="toggleCard(this)">
      <span class="chevron">▸</span>
      <span class="title">${esc(edu.institution || '(untitled)')}</span>
      <span class="sub">${esc(edu.degree || '')}</span>
      <span class="sub">${esc(edu.period || '')}</span>
      <button class="move" ${idx===0?"disabled":""} onclick="event.stopPropagation();moveData('education',${idx},-1)">↑</button>
      <button class="move" ${idx===total-1?"disabled":""} onclick="event.stopPropagation();moveData('education',${idx},1)">↓</button>
    </div>
    <div class="data-card-body">
      <label class="field">Institution</label>
      <input type="text" value="${escAttr(edu.institution||'')}" data-edu-idx="${idx}" data-edu-field="institution">
      <div class="row">
        <div style="flex:1"><label class="field">Degree</label>
          <input type="text" style="width:100%" value="${escAttr(edu.degree||'')}" data-edu-idx="${idx}" data-edu-field="degree">
        </div>
        <div style="flex:1"><label class="field">Period</label>
          <input type="text" style="width:100%" value="${escAttr(edu.period||'')}" data-edu-idx="${idx}" data-edu-field="period">
        </div>
      </div>
      <div class="row">
        <div style="flex:1"><label class="field">CGA</label>
          <input type="text" style="width:100%" value="${escAttr(edu.cgpa||'')}" data-edu-idx="${idx}" data-edu-field="cgpa">
        </div>
        <div style="flex:1"><label class="field">id (do NOT change)</label>
          <input type="text" style="width:100%" value="${escAttr(edu.id||'')}" data-edu-idx="${idx}" data-edu-field="id">
        </div>
      </div>
      <label class="field">Key Courses</label>
      <input type="text" value="${escAttr(edu.courses||'')}" data-edu-idx="${idx}" data-edu-field="courses">
      <label class="field">Awards &amp; Scholarships</label>
      <input type="text" value="${escAttr(edu.awards||'')}" data-edu-idx="${idx}" data-edu-field="awards">

      <div class="card-actions">
        <span></span>
        <button class="btn-sm danger" onclick="deleteEdu(${idx})">Delete this education</button>
      </div>
    </div>
  </div>`;
}

function renderVariantBlock(kind, id, vName, bullets) {
  return `<div class="variant-block">
    <div class="vr-head">
      <input type="text" value="${escAttr(vName)}" data-var-name="${vName}" data-kind="${kind}" data-id="${id}" placeholder="variant name">
      <button class="btn-sm danger" onclick="removeVariant('${kind}','${id}','${vName}')" ${Object.keys(editData[kind][id].variants).length<=1?"disabled":""}>−</button>
    </div>
    <textarea data-var-bullets="${vName}" data-kind="${kind}" data-id="${id}"
      placeholder="One bullet per line">${esc(bullets.join("\n"))}</textarea>
  </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function escAttr(s) {
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---- Data tab events (delegated from dataContent) ----
document.getElementById("dataContent").addEventListener("input", function(e) {
  const t = e.target;
  if (t.dataset.personalField) {
    if (!editData.personal) editData.personal = {};
    editData.personal[t.dataset.personalField] = t.value;
  }
  if (t.dataset.field) {
      editData[t.dataset.kind][t.dataset.id][t.dataset.field] = t.value;
  }
  if (t.dataset.eduIdx !== undefined) {
    const idx = parseInt(t.dataset.eduIdx);
    const field = t.dataset.eduField;
    if (editData.education[idx]) editData.education[idx][field] = t.value;
  }
  if (t.dataset.skillKey !== undefined) {
    const idx = parseInt(t.dataset.skillKey);
    const entries = Object.entries(editData.skills || {});
    if (idx >= 0 && idx < entries.length) {
      entries[idx][0] = t.value.trim() || entries[idx][0];
      editData.skills = Object.fromEntries(entries);
    }
  }
  if (t.dataset.skillVal !== undefined) {
    const idx = parseInt(t.dataset.skillVal);
    const entries = Object.entries(editData.skills || {});
    if (idx >= 0 && idx < entries.length) {
      entries[idx][1] = t.value;
      editData.skills = Object.fromEntries(entries);
    }
  }
  if (t.dataset.varName) {
    // variant name change
    const section = editData[t.dataset.kind][t.dataset.id];
    const oldName = t.dataset.varName;
    const newName = t.value.trim();
    if (newName && newName !== oldName && section.variants[oldName] !== undefined) {
      section.variants[newName] = section.variants[oldName];
      delete section.variants[oldName];
      t.dataset.varName = newName;
    }
  }
  if (t.dataset.varBullets) {
    // bullets textarea change
    const section = editData[t.dataset.kind][t.dataset.id];
    const vName = t.dataset.varBullets;
    section.variants[vName] = t.value.split("\n").filter(line => line.trim());
    if (section.variants[vName].length === 0) section.variants[vName] = [];
  }
});

function toggleCard(header) {
  header.parentElement.classList.toggle("open");
}

function moveData(kind, idx, dir) {
  if (kind === "education") {
    const arr = editData.education || [];
    const j = idx + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    renderDataTab();
    return;
  }
  const order = getOrder(kind);
  const j = idx + dir;
  if (j < 0 || j >= order.length) return;
  [order[idx], order[j]] = [order[j], order[idx]];
  renderDataTab();
}

function addVariant(kind, id) {
  const section = editData[kind][id];
  let n = Object.keys(section.variants).length + 1;
  let name = `v${n}`;
  while (section.variants[name] !== undefined) { n++; name = `v${n}`; }
  section.variants[name] = [];
  renderDataTab();
  // Reopen the card
  const card = document.getElementById(`card_${kind}_${id}`);
  if (card) card.classList.add("open");
}

function removeVariant(kind, id, vName) {
  const section = editData[kind][id];
  if (Object.keys(section.variants).length <= 1) {
    toast("Cannot remove the last variant");
    return;
  }
  delete section.variants[vName];
  renderDataTab();
  const card = document.getElementById(`card_${kind}_${id}`);
  if (card) card.classList.add("open");
}

function deleteCard(kind, id) {
  const section = editData[kind][id];
  const name = section ? (section.company || section.title || id) : id;
  if (!confirm(`Delete "${name}"? This will also remove it from all saved profiles.`)) return;
  delete editData[kind][id];
  const order = getOrder(kind);
  const idx = order.indexOf(id);
  if (idx >= 0) order.splice(idx, 1);
  renderDataTab();
}

function deleteEdu(idx) {
  const edu = editData.education[idx];
  const name = edu ? (edu.institution || 'untitled') : 'untitled';
  if (!confirm(`Delete education "${name}"?`)) return;
  editData.education.splice(idx, 1);
  renderDataTab();
}

function addSkill() {
  if (!editData.skills) editData.skills = {};
  let n = Object.keys(editData.skills).length + 1;
  let key = `category_${n}`;
  while (editData.skills[key] !== undefined) { n++; key = `category_${n}`; }
  editData.skills[key] = "";
  renderDataTab();
}

function removeSkill(idx) {
  const entries = Object.entries(editData.skills || {});
  if (idx < 0 || idx >= entries.length) return;
  entries.splice(idx, 1);
  editData.skills = Object.fromEntries(entries);
  renderDataTab();
}

function addNew(kind) {
  if (kind === "educations") {
    if (!editData.education) editData.education = [];
    const suffix = Date.now().toString(36).slice(-4);
    editData.education.push({
      id: `new_edu_${suffix}`,
      institution: "", period: "", degree: "", cgpa: "", courses: "", awards: ""
    });
    renderDataTab();
    setTimeout(() => {
      const card = document.getElementById(`card_education_${editData.education.length - 1}`);
      if (card) { card.classList.add("open"); card.scrollIntoView({ behavior: "smooth", block: "center" }); }
    }, 100);
    return;
  }
  const id = "_" + Date.now().toString(36);
  if (kind === "experiences") {
    editData.experiences[id] = {
      company: "", role: "", location: "", period: "", variants: { v1: [] }
    };
  } else {
    editData.projects[id] = {
      title: "", period: "", variants: { v1: [] }
    };
  }
  editData._order[kind].push(id);
  renderDataTab();
  setTimeout(() => {
    const card = document.getElementById(`card_${kind}_${id}`);
    if (card) { card.classList.add("open"); card.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }, 100);
}

function saveData() {
  const payload = {
    education: editData.education || [],
    experiences: editData.experiences || {},
    projects: editData.projects || {},
    skills: editData.skills || {},
    personal: editData.personal || {}
  };
  toast("Saving…");
  fetch("/api/save_data", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(r => r.json())
    .then(resp => {
      if (resp.ok) {
        toast("Saved to cv_data.yaml. Reloading…");
        setTimeout(() => location.reload(), 600);
      } else {
        toast("Save failed");
      }
    }).catch(() => toast("Save failed"));
}

// ====================== Shared ======================
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ====================== Boot ======================
initBuildState();
renderBuild();
refreshPreview();
populateProfiles({{ profiles | tojson }});
</script>
